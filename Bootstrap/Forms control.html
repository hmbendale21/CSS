<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href ="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet" />
    <link rel ="stylesheet" href ="bootstrap 2.css">
</head>
<body> 
    
    <div class="container">
        <h2>Form Demo</h2>
        <form>
            <div class="row">
                <div class="mb-3 col-md-6">
        <label for="email" class="form-label">Email address</label>
        <input type="email" 
            class="form-control" 
            id="email" 
            placeholder="name@example.com">
        </div>

         <div class="mb-3 col-md-6">
        <label for="password" class="form-label">Password</label>
        <input type="password" 
            class="form-control" 
            id="password" 
            placeholder="Password">
        </div>
            </div>
        
       
        <div>
            <select class="form-select" size="1">
                <option selected>Choose your role</option>
                <option value ="1">penetration tester</option>
                <option value ="2">Security engineer</option>
                <option value ="3">Security Analyst</option>
                <option value ="4">Network analyst</option>
            </select>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="checkIndeterminate">
            <label class="form-check-label" for="checkIndeterminate">
                Agree to terms and conditions
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
            <label class="form-check-label" for="radioDefault1">
                Yes/no
            </label>
        </div>
        <div class="mb-3">
            <label for="formFile" class="form-label">Insert your documents here</label>
            <input class="form-control" type="file" id="formFile">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>

        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
            <label class="form-check-label" for="switchCheckDefault">switch to on it</label>
        </div>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
